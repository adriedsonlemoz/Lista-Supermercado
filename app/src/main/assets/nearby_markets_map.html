<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body, #map { width:100%; height:100%; margin:0; padding:0; background:#f6f4f7; }
    .leaflet-control-attribution { font-size:10px; }
    .market-popup { min-width:190px; font-family: sans-serif; }
    .market-popup h3 { margin:0 0 4px; font-size:15px; }
    .market-popup p { margin:2px 0 10px; font-size:12px; color:#555; }
    .market-popup button { width:100%; border:0; border-radius:12px; padding:10px 12px; background:#2E6B47; color:white; font-weight:700; }
  </style>
</head>
<body>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const map = L.map('map', { zoomControl: true }).setView([-15.78, -47.93], 4);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  let userMarker = null;
  let marketLayer = L.layerGroup().addTo(map);

  function setUserLocation(lat, lon) {
    if (userMarker) map.removeLayer(userMarker);
    userMarker = L.circleMarker([lat, lon], {
      radius: 8, color: '#1f5fa8', fillColor: '#4e8bd1', fillOpacity: 1, weight: 3
    }).addTo(map).bindPopup('Sua localização');
    map.setView([lat, lon], 14);
  }

  function renderMarkets(markets) {
    marketLayer.clearLayers();
    const bounds = [];
    if (userMarker) bounds.push(userMarker.getLatLng());

    markets.forEach(function(m) {
      const marker = L.circleMarker([m.lat, m.lon], {
        radius: 7, color: '#2E6B47', fillColor: '#4d8d68', fillOpacity: 1, weight: 2
      }).addTo(marketLayer);
      const distance = m.distanceMeters < 1000
        ? Math.round(m.distanceMeters) + ' m'
        : (m.distanceMeters / 1000).toFixed(1).replace('.', ',') + ' km';

      const popup = document.createElement('div');
      popup.className = 'market-popup';
      const title = document.createElement('h3');
      title.textContent = m.name || 'Supermercado';
      popup.appendChild(title);

      const detail = document.createElement('p');
      detail.textContent = (m.address ? m.address + ' • ' : '') + distance;
      popup.appendChild(detail);

      const button = document.createElement('button');
      button.textContent = 'Criar lista';
      button.onclick = function() {
        AndroidMarket.createList(m.name || 'Supermercado', m.lat, m.lon);
      };
      popup.appendChild(button);

      marker.bindPopup(popup);
      bounds.push([m.lat, m.lon]);
    });

    if (bounds.length > 1) map.fitBounds(bounds, {padding:[28,28], maxZoom:15});
  }
</script>
<script>
  const map = L.map('map', { zoomControl: true }).setView([-15.78, -47.93], 4);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  let userMarker = null;
  let marketLayer = L.layerGroup().addTo(map);

  function setUserLocation(lat, lon) {
    if (userMarker) map.removeLayer(userMarker);
    userMarker = L.circleMarker([lat, lon], {
      radius: 8, color: '#1f5fa8', fillColor: '#4e8bd1', fillOpacity: 1, weight: 3
    }).addTo(map).bindPopup('Sua localização');
    map.setView([lat, lon], 14);
  }

  function renderMarkets(markets) {
    marketLayer.clearLayers();
    const bounds = [];
    if (userMarker) bounds.push(userMarker.getLatLng());

    markets.forEach(function(m) {
      const marker = L.circleMarker([m.lat, m.lon], {radius:7,color:'#2E6B47',fillColor:'#4d8d68',fillOpacity:1,weight:2}).addTo(marketLayer);
      const safeName = String(m.name || 'Supermercado').replace(/'/g, "\\'").replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const distance = m.distanceMeters < 1000
        ? Math.round(m.distanceMeters) + ' m'
        : (m.distanceMeters / 1000).toFixed(1).replace('.', ',') + ' km';
      const address = m.address ? '<p>' + String(m.address).replace(/</g, '&lt;').replace(/>/g, '&gt;') + '<br>' + distance + '</p>' : '<p>' + distance + '</p>';
      const html = '<div class="market-popup"><h3>' + safeName + '</h3>' + address +
        '<button onclick="AndroidMarket.createList(\'' + safeName + '\',' + m.lat + ',' + m.lon + ')">Criar lista</button></div>';
      marker.bindPopup(html);
      bounds.push([m.lat, m.lon]);
    });

    if (bounds.length > 1) map.fitBounds(bounds, {padding:[28,28], maxZoom:15});
  }
</script>
</body>
</html>
