<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body, #map { width:100%; height:100%; margin:0; padding:0; background:#101820; }
    .leaflet-control-attribution { font-size:10px; }
    .market-popup { min-width:190px; font-family:sans-serif; }
    .market-popup h3 { margin:0 0 4px; font-size:15px; }
    .market-popup p { margin:2px 0 10px; font-size:12px; color:#555; }
    .market-popup button {
      width:100%; border:0; border-radius:12px; padding:10px 12px;
      background:#6D4FD3; color:white; font-weight:700;
    }
  </style>
</head>
<body>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const map = L.map('map', { zoomControl: true }).setView([-15.78, -47.93], 4);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  let userMarker = null;
  const marketLayer = L.layerGroup().addTo(map);

  function setUserLocation(lat, lon) {
    if (userMarker) map.removeLayer(userMarker);
    userMarker = L.circleMarker([lat, lon], {
      radius: 8,
      color: '#385F8A',
      fillColor: '#5F8FC2',
      fillOpacity: 1,
      weight: 3
    }).addTo(map).bindPopup('Sua localização');
    map.setView([lat, lon], 13);
  }

  function renderMarkets(markets) {
    marketLayer.clearLayers();
    const bounds = [];
    if (userMarker) bounds.push(userMarker.getLatLng());

    markets.forEach(function(m) {
      const marker = L.circleMarker([m.lat, m.lon], {
        radius: 7,
        color: '#6D4FD3',
        fillColor: '#8B6CF6',
        fillOpacity: 1,
        weight: 2
      }).addTo(marketLayer);

      const distance = m.distanceMeters < 1000
        ? Math.round(m.distanceMeters) + ' m'
        : (m.distanceMeters / 1000).toFixed(1).replace('.', ',') + ' km';

      const popup = document.createElement('div');
      popup.className = 'market-popup';

      const title = document.createElement('h3');
      title.textContent = m.name || 'Mercado';
      popup.appendChild(title);

      const detail = document.createElement('p');
      detail.textContent = (m.address ? m.address + ' • ' : '') + distance;
      popup.appendChild(detail);

      const button = document.createElement('button');
      button.textContent = 'Criar lista';
      button.onclick = function() {
        AndroidMarket.createList(m.name || 'Mercado', m.lat, m.lon);
      };
      popup.appendChild(button);

      marker.bindPopup(popup);
      bounds.push([m.lat, m.lon]);
    });

    if (bounds.length > 1) {
      map.fitBounds(bounds, { padding:[28,28], maxZoom:14 });
    }
  }
</script>
</body>
</html>
